services:
  - type: web
    name: shopizer-backend
    env: docker
    dockerfilePath: ./sm-shop/Dockerfile
    dockerContext: ./
    envVars:
      - key: PORT
        value: 10000
      - key: JAVA_OPTS
        value: -Xmx512m -Xms256m
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQL10Dialect
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: ALLOWED_ORIGINS
        sync: false
